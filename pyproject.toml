[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fmm-chatbot"
version = "0.1.0"
description = "FMM Knowledge and Operational Assistant (CRIS) - Phase 1 foundation"
requires-python = ">=3.11,<3.12"
readme = "README.md"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: requires a live PostgreSQL 16 instance with pgvector",
]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".venv", ".pgdata", "data", "models", "logs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501", "B008", "ASYNC109"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = false
